name: Dispatch SDKs Regeneration

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to dispatch to SDKs (blank uses the ref this run was started from)'
        required: false

jobs:
  dispatch:
    name: Dispatch Event to SDKs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - xyo-financial/sdk-cpp
          - xyo-financial/sdk-rust
          - xyo-financial/sdk-go
          - xyo-financial/sdk-java
          - xyo-financial/sdk-dotnet
          - xyo-financial/sdk-python
          - xyo-financial/sdk-node
      fail-fast: false

    steps:
      - name: Dispatch ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SDK_DISPATCH_TOKEN || secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: spec_tagged
          # inputs.tag must come first: github.ref_name is populated on every
          # event, including workflow_dispatch, so putting it first short-circuits
          # the fallback and makes the manual input unreachable. On a tag push the
          # inputs context is empty, so this still resolves to the pushed tag.
          client-payload: '{"tag": "${{ inputs.tag || github.ref_name }}"}'
