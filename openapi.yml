openapi: 3.0.0
info:
  title: XYO RESTful Transaction Enrichment API
  version: 2.0.5
  description: "RESTful API for enriching financial transactions."
  contact:
    name: Syniol Support
    url: https://syniol.com
servers:
  - url: https://api.xyo.financial
    description: "Production API Server"
security:
  - BearerAuth: []
tags:
  - name: Enrichment
    description: "Endpoints related to enriching financial transactions."
paths:
  /v1/ai/finance/enrichment/transaction:
    post:
      summary: Transaction Enrichment
      description: "Enrich a single financial transaction synchronously."
      operationId: enrichTransaction
      tags:
        - Enrichment
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceParentHeader"
      requestBody:
        description: "Transaction enrichment request payload containing payment text and ISO-3166-1 alpha-2 country code."
        required: true
        content:
          application/json:
            schema:
              title: EnrichmentRequest
              type: object
              properties:
                content:
                  type: string
                  maxLength: 128
                  description: "Content is the payment description, maximum 128 characters."
                  example: "COSTA PICKUP LONDON"
                countryCode:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: "CountryCode is the ISO 3166-1 alpha-2 two-character country code."
                  example: "GB"
              required:
                - content
                - countryCode
            examples:
              costa:
                summary: "Costa Coffee transaction"
                description: "Single payment description from a UK Costa Coffee pickup order."
                value:
                  content: "COSTA PICKUP LONDON"
                  countryCode: "GB"
              starbucks:
                summary: "Starbucks transaction"
                description: "Single payment description from a US Starbucks store order."
                value:
                  content: "STARBUCKS STORE #10423 SEATTLE WA"
                  countryCode: "US"
              uber:
                summary: "Uber ride transaction"
                description: "Single payment description from an Uber ride."
                value:
                  content: "UBER *TRIP 12345 HELP.UBER.COM"
                  countryCode: "GB"
              tfl:
                summary: "Transport for London transaction"
                description: "Single payment description from TfL contactless travel charge."
                value:
                  content: "TfL Travel Charge tfl.gov.uk"
                  countryCode: "GB"
      responses:
        "200":
          description: "Successful response returning enriched merchant and categorization details."
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                title: EnrichmentResponse
                type: object
                properties:
                  merchant:
                    type: string
                    description: "Merchant is the name of the merchant."
                    example: "Costa Coffee"
                  description:
                    type: string
                    description: "Description is a brief description of the merchant."
                    example: "Costa Coffee is a British coffeehouse chain and a subsidiary of The Coca-Cola Company."
                  categories:
                    type: array
                    items:
                      type: string
                    description: "Categories lists categories fitting the description of the merchant."
                    example:
                      - "Food & Beverage"
                      - "Cafes & Coffee Shops"
                      - "Dining Out"
                  logo:
                    type: string
                    description: "Logo is a base64-encoded PNG or JPEG representing the merchant logo."
                    example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
                  location:
                    type: string
                    description: "Location describes the country and city. May be empty if the API returns null."
                    example: "United Kingdom, London"
                  address:
                    type: string
                    description: "Address describes the exact address of purchase. May be empty if the API returns null."
                    example: "40-42 Great Portland St, London W1W 7LZ"
                required:
                  - merchant
                  - description
                  - categories
                  - logo
                  - location
                  - address
              examples:
                costa:
                  summary: "Costa Coffee enriched response"
                  description: "Enrichment response for Costa Coffee in London, UK."
                  value:
                    merchant: "Costa Coffee"
                    description: "Costa Coffee is a British coffeehouse chain and a subsidiary of The Coca-Cola Company."
                    categories:
                      - "Food & Beverage"
                      - "Cafes & Coffee Shops"
                      - "Dining Out"
                    logo: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
                    location: "United Kingdom, London"
                    address: "40-42 Great Portland St, Marylebone, London W1W 7LZ"
                starbucks:
                  summary: "Starbucks enriched response"
                  description: "Enrichment response for Starbucks store in Seattle, US."
                  value:
                    merchant: "Starbucks"
                    description: "Starbucks Corporation is an American multinational chain of coffeehouses and roastery reserves headquartered in Seattle, Washington."
                    categories:
                      - "Food & Beverage"
                      - "Cafes & Coffee Shops"
                      - "Dining Out"
                    logo: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
                    location: "United States, Seattle"
                    address: "1912 Pike Pl, Seattle, WA 98101"
                uber:
                  summary: "Uber enriched response"
                  description: "Enrichment response for Uber ride-hailing services."
                  value:
                    merchant: "Uber"
                    description: "Uber Technologies, Inc. provides mobility services, ride-hailing, food delivery, and freight transport."
                    categories:
                      - "Transportation"
                      - "Ride Sharing & Taxis"
                      - "Travel"
                    logo: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
                    location: "United Kingdom, London"
                    address: "Aldgate Tower, 2 Leman St, London E1 8FA"
                tfl:
                  summary: "Transport for London enriched response"
                  description: "Enrichment response for Transport for London public transit."
                  value:
                    merchant: "Transport for London"
                    description: "Transport for London (TfL) is the local government body responsible for the transport network in Greater London."
                    categories:
                      - "Public Transportation"
                      - "Trains & Subways"
                      - "Commuter Transit"
                    logo: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
                    location: "United Kingdom, London"
                    address: "5 Endeavour Square, London E20 1JN"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "3XX":
          description: Redirection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "4XX":
          description: Client Error
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  summary: "401 Unauthorized Error"
                  value:
                    errors:
                      - type: "https://api.xyo.financial/errors/unauthorized"
                        title: "Unauthorized"
                        status: 401
                        detail: "Invalid or expired Bearer authentication token provided."
                        instance: "/v1/ai/finance/enrichment/transaction#req-001"
                badRequest:
                  summary: "400 Bad Request Error"
                  value:
                    errors:
                      - type: "https://api.xyo.financial/errors/bad-request"
                        title: "Bad Request"
                        status: 400
                        detail: "Request body is missing required field 'countryCode'."
                        instance: "/v1/ai/finance/enrichment/transaction#req-002"
        "5XX":
          description: Server Error
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerError:
                  summary: "500 Internal Server Error"
                  value:
                    errors:
                      - type: "https://api.xyo.financial/errors/internal-server-error"
                        title: "Internal Server Error"
                        status: 500
                        detail: "An unexpected server error occurred while processing transaction enrichment."
                        instance: "/v1/ai/finance/enrichment/transaction#req-003"
  /v1/ai/finance/enrichment/transactions:
    post:
      summary: Transaction Enrichments
      description: "Enrich a collection of financial transactions asynchronously."
      operationId: enrichTransactions
      tags:
        - Enrichment
      security:
        - BearerAuth: []
      parameters:
        - name: x-api-user
          in: header
          required: false
          deprecated: false
          description: "Optional identifier for the API user or tenant."
          schema:
            type: string
          example: syniol
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceParentHeader"
      requestBody:
        description: "Array of transaction enrichment requests (minimum 1, maximum 50,000 items) for asynchronous batch processing."
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 50000
              description: "Array of transactions to enrich (bounded between 1 and 50,000 items)."
              items:
                type: object
                properties:
                  content:
                    type: string
                    maxLength: 128
                    description: "Content is the payment description, maximum 128 characters."
                    example: "COSTA PICKUP LONDON"
                  countryCode:
                    type: string
                    minLength: 2
                    maxLength: 2
                    description: "CountryCode is the ISO 3166-1 alpha-2 two-character country code."
                    example: "GB"
                required:
                  - content
                  - countryCode
            examples:
              batchSample:
                summary: "Batch of sample transactions"
                description: "A collection of transactions including Costa Coffee, Starbucks, Uber, and Transport for London."
                value:
                  - content: "COSTA PICKUP LONDON"
                    countryCode: "GB"
                  - content: "STARBUCKS STORE #10423 SEATTLE WA"
                    countryCode: "US"
                  - content: "UBER *TRIP 12345 HELP.UBER.COM"
                    countryCode: "GB"
                  - content: "TfL Travel Charge tfl.gov.uk"
                    countryCode: "GB"
      responses:
        "200":
          description: "Successful response returning bulk job ID and download archive link."
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                title: EnrichTransactionCollectionResponse
                type: object
                properties:
                  id:
                    type: string
                    description: "ID is the work ID for the enrichment request."
                    example: "72c037df-d0d3-43ee-9470-323ff35a2e50"
                  link:
                    type: string
                    description: "Link is the URL to the downloadable tar.gz results archive."
                    example: "https://api.xyo.financial/v1/ai/finance/enrichment/download/72c037df-d0d3-43ee-9470-323ff35a2e50.tar.gz"
                required:
                  - id
                  - link
              examples:
                jobCreated:
                  summary: "Asynchronous job created"
                  value:
                    id: "72c037df-d0d3-43ee-9470-323ff35a2e50"
                    link: "https://api.xyo.financial/v1/ai/finance/enrichment/download/72c037df-d0d3-43ee-9470-323ff35a2e50.tar.gz"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "3XX":
          description: Redirection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "4XX":
          description: Client Error
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyBatch:
                  summary: "400 Bad Request (Empty Batch)"
                  value:
                    errors:
                      - type: "https://api.xyo.financial/errors/invalid-batch-size"
                        title: "Invalid Batch Size"
                        status: 400
                        detail: "Batch payload must contain at least 1 transaction (minItems: 1)."
                        instance: "/v1/ai/finance/enrichment/transactions#req-004"
                oversizedBatch:
                  summary: "400 Bad Request (Oversized Batch)"
                  value:
                    errors:
                      - type: "https://api.xyo.financial/errors/invalid-batch-size"
                        title: "Invalid Batch Size"
                        status: 400
                        detail: "Batch payload exceeds maximum limit of 50,000 transactions (maxItems: 50000). Please partition into smaller batches."
                        instance: "/v1/ai/finance/enrichment/transactions#req-005"
        "5XX":
          description: Server Error
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/ai/finance/enrichment/status/{id}:
    get:
      summary: Transaction Enrichments Status
      description: "Get the status of an asynchronous bulk enrichment job."
      operationId: getEnrichmentStatus
      tags:
        - Enrichment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "The unique identifier of the asynchronous bulk enrichment job."
          schema:
            type: string
          example: "72c037df-d0d3-43ee-9470-323ff35a2e50"
        - name: x-api-user
          in: header
          required: false
          deprecated: false
          description: "Optional identifier for the API user or tenant."
          schema:
            type: string
          example: syniol
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceParentHeader"
      responses:
        "200":
          description: "Successful response returning the current processing status of the bulk enrichment job."
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                title: EnrichmentCollectionStatusResponse
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - READY
                      - FAILED
                      - PENDING
                    description: "Status represents the processing state of a bulk enrichment job."
                    example: "READY"
                required:
                  - status
              examples:
                ready:
                  summary: "Job completed and ready"
                  value:
                    status: "READY"
                pending:
                  summary: "Job still processing"
                  value:
                    status: "PENDING"
                failed:
                  summary: "Job processing failed"
                  value:
                    status: "FAILED"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "3XX":
          description: Redirection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "4XX":
          description: Client Error
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "5XX":
          description: Server Error
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: "Unique caller correlation identifier (UUIDv4) for distributed tracing across microservice boundaries."
      schema:
        type: string
        format: uuid
        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
    TraceParentHeader:
      name: traceparent
      in: header
      required: false
      description: "Standard W3C TraceContext header (version-trace_id-parent_id-trace_flags) for distributed APM tracing."
      schema:
        type: string
        example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
  headers:
    RetryAfter:
      description: "Number of seconds the client must wait before retrying the rate-limited request."
      schema:
        type: integer
        example: 30
    RateLimitLimit:
      description: "Maximum number of requests permitted in the current rate limit window."
      schema:
        type: integer
        example: 100
    RateLimitRemaining:
      description: "Remaining number of requests allowed in the current rate limit window."
      schema:
        type: integer
        example: 0
    RateLimitReset:
      description: "Time in seconds remaining until the rate limit window resets."
      schema:
        type: integer
        example: 30
    CorrelationIdResponseHeader:
      description: "Unique correlation identifier echoed back in the response for end-to-end distributed tracing."
      schema:
        type: string
        format: uuid
        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
  responses:
    TooManyRequestsError:
      description: "Too Many Requests - Rate limit or quota exceeded."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimitExceeded:
              summary: "429 Rate Limit Exceeded"
              value:
                errors:
                  - type: "https://api.xyo.financial/errors/rate-limit-exceeded"
                    title: "Too Many Requests"
                    status: 429
                    detail: "Rate limit quota exceeded. Please retry after 30 seconds."
                    instance: "urn:trace:9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
  schemas:
    APIError:
      type: object
      description: "RFC 7807 compliant problem details object representing an API error."
      properties:
        type:
          type: string
          description: "A URI reference identifying the problem type."
          example: "https://api.xyo.financial/errors/unauthorized"
        title:
          type: string
          description: "A short, human-readable summary of the problem type."
          example: "Unauthorized"
        status:
          type: integer
          description: "The HTTP status code generated by the origin server for this occurrence of the problem."
          example: 401
        detail:
          type: string
          description: "A human-readable explanation specific to this occurrence of the problem."
          example: "Invalid or expired Bearer authentication token provided."
        instance:
          type: string
          description: "A URI reference identifying the specific occurrence of the problem."
          example: "/v1/ai/finance/enrichment/transaction#req-9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      required:
        - type
        - title
        - status
        - detail
        - instance
      example:
        type: "https://api.xyo.financial/errors/unauthorized"
        title: "Unauthorized"
        status: 401
        detail: "Invalid or expired Bearer authentication token provided."
        instance: "/v1/ai/finance/enrichment/transaction#req-9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
    ErrorResponse:
      type: object
      description: "Standard error response envelope containing a list of RFC 7807 problem details errors."
      properties:
        errors:
          type: array
          description: "List of problem details errors returned by the API."
          items:
            $ref: "#/components/schemas/APIError"
      required:
        - errors
      example:
        errors:
          - type: "https://api.xyo.financial/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Invalid or expired Bearer authentication token provided."
            instance: "/v1/ai/finance/enrichment/transaction#req-9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HTTP Bearer authentication scheme using API tokens or JWTs."
